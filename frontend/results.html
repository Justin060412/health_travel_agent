<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="AI 康养旅居匹配分析报告">
  <title>康养旅居 · AI 决策报告</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="vendor/ol.css?v=10.10.0">
  <link rel="stylesheet" href="css/results-deck.css?v=m3-2">
</head>
<body class="results-deck-page">
  <nav class="deck-nav" aria-label="报告导航">
    <a class="deck-brand" href="index.html" aria-label="返回康养旅居首页">
      <span class="deck-brand-mark" aria-hidden="true">旅</span>
      <span>AI 康养旅居</span>
    </a>
    <div class="deck-nav-meta">
      <span id="deck-engine-status">正在读取分析</span>
      <a href="questionnaire.html">重新分析</a>
    </div>
  </nav>

  <main class="deck-app" id="deck-app" aria-live="polite">
    <section class="deck-loading" id="deck-loading">
      <span class="deck-loading-mark" aria-hidden="true"></span>
      <p>正在组织您的康养决策报告</p>
    </section>

    <section class="deck-empty" id="deck-empty" hidden>
      <span>尚未生成分析报告</span>
      <h1>先告诉 AI 您需要怎样的康养旅居</h1>
      <p>完成问卷后，这里会按匹配度依次呈现五个目的地，并保留每项结论的数据边界。</p>
      <a href="questionnaire.html" class="deck-primary-link">开始 AI 分析</a>
    </section>

    <div class="deck-report" id="deck-report" hidden>
      <div class="deck-slides" id="deck-slides"></div>

      <aside class="deck-map-shell" id="deck-map-shell" aria-label="当前目的地地图">
        <div class="deck-map-topline">
          <span>空间位置</span>
          <strong id="deck-map-place">--</strong>
        </div>
        <div class="deck-map" id="results-map"></div>
        <p class="deck-map-note" id="deck-map-note">目的地位置 · WGS84 坐标</p>
      </aside>

      <button class="deck-context-jump" id="deck-context-jump" hidden></button>

      <footer class="deck-controls" aria-label="报告翻页控制">
        <button class="deck-control-btn" id="deck-prev" aria-label="上一页">← <span>上一页</span></button>
        <div class="deck-progress" aria-live="polite">
          <strong id="deck-progress-value">01 / 05</strong>
          <span id="deck-progress-label">最佳匹配</span>
          <div class="deck-progress-track"><i id="deck-progress-bar"></i></div>
        </div>
        <button class="deck-control-btn deck-next" id="deck-next" aria-label="下一页"><span>下一页</span> →</button>
      </footer>

      <div class="deck-evidence-backdrop" id="deck-evidence-backdrop" hidden></div>
      <aside class="deck-evidence-drawer" id="deck-evidence-drawer" aria-labelledby="deck-evidence-title" aria-hidden="true" hidden>
        <div class="deck-evidence-head">
          <div>
            <span>可信依据</span>
            <h2 id="deck-evidence-title">查看推荐依据</h2>
          </div>
          <button id="deck-evidence-close" type="button" aria-label="关闭依据面板">×</button>
        </div>
        <p class="deck-evidence-intro" id="deck-evidence-intro">这里只回答当前目的地已有可信资料能够支持的问题。</p>
        <form class="deck-evidence-form" id="deck-evidence-form">
          <label for="deck-evidence-question">继续追问</label>
          <textarea id="deck-evidence-question" rows="3" maxlength="300" placeholder="例如：这里的医疗能力有哪些官方依据？"></textarea>
          <button type="submit">查找依据</button>
          <small>使用本地 RAG，不发送给外部 AI。</small>
        </form>
        <div class="deck-evidence-answer" id="deck-evidence-answer" aria-live="polite"></div>
      </aside>
    </div>
  </main>

  <script src="vendor/ol.js?v=10.10.0"></script>
  <script src="js/api.js?v=act2-v2-5"></script>
  <script src="js/results-deck.js?v=m3-2"></script>
</body>
</html>
