<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>康养旅居 · 偏好问卷</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="questionnaire-page">

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <span class="nav-brand-icon">
          <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 4L28 22H20L24 30H10L14 22H6L17 4Z" fill="currentColor" opacity="0.9"/>
            <circle cx="17" cy="10" r="3" fill="currentColor" opacity="0.5"/>
          </svg>
        </span>
        <span>康养旅居</span>
      </a>
    </div>
  </nav>

  <!-- ── 问卷主体 ────────────────────────────────────────── -->
  <div class="q-container">

    <div class="q-header">
      <h2>📋 康养旅居偏好问卷</h2>
      <p>填写以下信息，AI 将为您精准匹配最适合的康养目的地</p>
    </div>

    <!-- 基础信息 -->
    <div class="q-section">
      <div class="q-section-title">
        <span class="q-section-icon">👤</span> 基础信息
      </div>

      <div class="q-row">
        <div class="q-field" style="flex: 0 0 100px;">
          <label class="q-label" for="age">年龄</label>
          <input class="q-input" type="number" id="age" name="age"
                 min="18" max="100" placeholder="请输入" required>
          <span class="field-error" id="error-age"></span>
        </div>
        <div class="q-field">
          <label class="q-label">性别</label>
          <div class="q-options">
            <input class="q-radio" type="radio" name="gender" id="gender-male" value="男">
            <label class="q-option" for="gender-male">👨 男</label>
            <input class="q-radio" type="radio" name="gender" id="gender-female" value="女">
            <label class="q-option" for="gender-female">👩 女</label>
          </div>
        </div>
      </div>

      <div class="q-row">
        <div class="q-field">
          <label class="q-label" for="city">当前居住城市 <span class="optional">(选填)</span></label>
          <input class="q-input" type="text" id="city" name="city"
                 placeholder="例如：上海、武汉、成都">
        </div>
      </div>
    </div>

    <!-- 康养需求 -->
    <div class="q-section">
      <div class="q-section-title">
        <span class="q-section-icon">💰</span> 康养需求
      </div>

      <div class="q-row">
        <div class="q-field">
          <label class="q-label">月预算</label>
          <div class="q-options">
            <input class="q-radio" type="radio" name="budget" id="budget-1" value="3000以下">
            <label class="q-option" for="budget-1">3,000 元以下</label>
            <input class="q-radio" type="radio" name="budget" id="budget-2" value="3000-5000">
            <label class="q-option" for="budget-2">3,000 – 5,000</label>
            <input class="q-radio" type="radio" name="budget" id="budget-3" value="5000-8000">
            <label class="q-option" for="budget-3">5,000 – 8,000</label>
            <input class="q-radio" type="radio" name="budget" id="budget-4" value="8000以上">
            <label class="q-option" for="budget-4">8,000 元以上</label>
          </div>
          <span class="field-error" id="error-budget"></span>
        </div>
      </div>

      <div class="q-row">
        <div class="q-field">
          <label class="q-label">康养时长</label>
          <div class="q-options">
            <input class="q-radio" type="radio" name="duration" id="dur-1" value="1周">
            <label class="q-option" for="dur-1">1 周</label>
            <input class="q-radio" type="radio" name="duration" id="dur-2" value="1个月">
            <label class="q-option" for="dur-2">1 个月</label>
            <input class="q-radio" type="radio" name="duration" id="dur-3" value="3个月">
            <label class="q-option" for="dur-3">3 个月</label>
            <input class="q-radio" type="radio" name="duration" id="dur-4" value="半年以上">
            <label class="q-option" for="dur-4">半年以上</label>
          </div>
        </div>
      </div>
    </div>

    <!-- 健康状况 -->
    <div class="q-section">
      <div class="q-section-title">
        <span class="q-section-icon">❤️</span> 健康状况
      </div>

      <div class="q-row">
        <div class="q-field">
          <label class="q-label">请选择您的健康状况（可多选）</label>
          <div class="q-options">
            <input class="q-checkbox" type="checkbox" name="health" id="health-1" value="三高">
            <label class="q-option" for="health-1">三高</label>
            <input class="q-checkbox" type="checkbox" name="health" id="health-2" value="心脑血管">
            <label class="q-option" for="health-2">心脑血管</label>
            <input class="q-checkbox" type="checkbox" name="health" id="health-3" value="呼吸系统">
            <label class="q-option" for="health-3">呼吸系统</label>
            <input class="q-checkbox" type="checkbox" name="health" id="health-4" value="睡眠问题">
            <label class="q-option" for="health-4">睡眠问题</label>
            <input class="q-checkbox" type="checkbox" name="health" id="health-5" value="亚健康">
            <label class="q-option" for="health-5">亚健康</label>
            <input class="q-checkbox" type="checkbox" name="health" id="health-6" value="无特殊情况">
            <label class="q-option" for="health-6">✅ 无特殊情况</label>
          </div>
        </div>
      </div>
    </div>

    <!-- 环境偏好 -->
    <div class="q-section">
      <div class="q-section-title">
        <span class="q-section-icon">🌤️</span> 环境偏好
      </div>

      <div class="q-row">
        <div class="q-field">
          <label class="q-label">气候偏好</label>
          <div class="q-options">
            <input class="q-radio" type="radio" name="climate" id="climate-cool" value="凉爽">
            <label class="q-option" for="climate-cool">❄️ 凉爽</label>
            <input class="q-radio" type="radio" name="climate" id="climate-warm" value="温暖">
            <label class="q-option" for="climate-warm">☀️ 温暖</label>
            <input class="q-radio" type="radio" name="climate" id="climate-any" value="无要求">
            <label class="q-option" for="climate-any">无要求</label>
          </div>
        </div>
      </div>

      <div class="q-row">
        <div class="q-field">
          <label class="q-label">自然环境（可多选）</label>
          <div class="q-options">
            <input class="q-checkbox" type="checkbox" name="environment" id="env-1" value="山地">
            <label class="q-option" for="env-1">⛰️ 山地</label>
            <input class="q-checkbox" type="checkbox" name="environment" id="env-2" value="森林">
            <label class="q-option" for="env-2">🌲 森林</label>
            <input class="q-checkbox" type="checkbox" name="environment" id="env-3" value="湖泊">
            <label class="q-option" for="env-3">🌊 湖泊</label>
            <input class="q-checkbox" type="checkbox" name="environment" id="env-4" value="海边">
            <label class="q-option" for="env-4">🏖️ 海边</label>
            <input class="q-checkbox" type="checkbox" name="environment" id="env-5" value="无要求">
            <label class="q-option" for="env-5">无要求</label>
          </div>
        </div>
      </div>
    </div>

    <!-- 提交按钮 -->
    <div class="q-submit">
      <button id="submit-btn" class="btn btn-primary btn-lg" type="button"
              onclick="handleSubmit()">
        ✨ 开始 AI 智能分析
      </button>
      <p class="q-submit-hint">提交后将由 AI 大模型为您生成个性化推荐</p>
    </div>

  </div>

  <!-- ── 底部 ────────────────────────────────────────────── -->
  <footer class="footer">
    上海师范大学 环境与地理科学学院 · 苏马荡山地候鸟式康养旅居
  </footer>

  <!-- ── 表单交互脚本 ────────────────────────────────────── -->
  <script>
    // “无特殊情况” 与其他健康选项互斥
    const healthNone = document.getElementById('health-6');
    const healthChecks = document.querySelectorAll('input[name="health"]:not(#health-6)');
    healthChecks.forEach(cb => {
     cb.addEventListener('change', () => { if (cb.checked) healthNone.checked = false; });
    });
    healthNone.addEventListener('change', () => {
      if (healthNone.checked) { healthChecks.forEach(cb => { cb.checked = false; }); }
    });

    // “无要求” 与其他环境选项互斥
    const envNone = document.getElementById('env-5');
    const envChecks = document.querySelectorAll('input[name="environment"]:not(#env-5)');
    envChecks.forEach(cb => {
      cb.addEventListener('change', () => { if (cb.checked) envNone.checked = false; });
    });
    envNone.addEventListener('change', () => {
      if (envNone.checked) { envChecks.forEach(cb => { cb.checked = false; }); }
    });

    // ── API 配置 ──────────────────────────────────────────
    const API_BASE = 'http://127.0.0.1:8000';

    // ── 字段映射 ──────────────────────────────────────────
    const BUDGET_MAP = {
      '3000以下': 2000, '3000-5000': 4000, '5000-8000': 6500, '8000以上': 10000,
    };
    const CLIMATE_MAP = {
      '凉爽': '避暑', '温暖': '避寒', '无要求': '不挑剔',
    };

    // 暂存最近一次 payload，供重试使用
    let lastPayload = null;

    // ── 内联校验 ──────────────────────────────────────────
    function clearErrors() {
      document.querySelectorAll('.field-error').forEach(el => { el.textContent = ''; });
      document.querySelectorAll('.q-input.error').forEach(el => { el.classList.remove('error'); });
      const budgetOpts = document.querySelector('input[name="budget"]')?.closest('.q-options');
      if (budgetOpts) budgetOpts.classList.remove('error');
    }

    function showFieldError(elId, msg) {
      const errEl = document.getElementById('error-' + elId);
      if (errEl) errEl.textContent = msg;
      const input = document.getElementById(elId);
      if (input) input.classList.add('error');
    }

    function showBudgetError(msg) {
      const errEl = document.getElementById('error-budget');
      if (errEl) errEl.textContent = msg;
      const opts = document.querySelector('input[name="budget"]')?.closest('.q-options');
      if (opts) opts.classList.add('error');
    }

    // ── AI 加载层 ─────────────────────────────────────────
    const THINKING_STEPS = [
      '读取您的健康需求…',
      '分析健康状况与适合的海拔区间…',
      '匹配预算与消费水平…',
      '检索目的地环境数据库…',
      'DeepSeek 大模型深度推理…',
      '生成个性化推荐方案…',
    ];
    let animationAbort = null;
    let safetyTimer = null;
    let apiResolved = false;
    let resolveApiPromise = null;

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function clearSafetyTimer() {
      if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
    }

    function showOverlay() {
      clearSafetyTimer();
      apiResolved = false;
      resolveApiPromise = null;
      document.getElementById('ai-overlay').style.display = 'flex';
      document.getElementById('ai-thinking').style.display = 'block';
      document.getElementById('ai-error').style.display = 'none';
      document.querySelectorAll('.ai-thinking-step').forEach((el, i) => {
        el.className = 'ai-thinking-step';
        el.querySelector('.step-text').textContent = THINKING_STEPS[i];
      });
      safetyTimer = setTimeout(() => {
        console.error('⚠️ 加载层安全超时触发（35 秒），强制关闭');
        showErrorCard('服务响应超时', 'AI 服务处理时间过长，请检查网络后重试。', true);
        resetButton();
      }, 35000);
    }

    function hideOverlay() {
      clearSafetyTimer();
      document.getElementById('ai-overlay').style.display = 'none';
    }

    function setStepState(index, state) {
      const steps = document.querySelectorAll('.ai-thinking-step');
      if (index >= 0 && index < steps.length) {
        steps[index].className = 'ai-thinking-step ' + state;
      }
    }

    async function runThinkingAnimation(apiPromise) {
      animationAbort = new AbortController();
      const signal = animationAbort.signal;

      // Steps 0-2: Play while API is running (600ms each)
      for (let i = 0; i <= 2; i++) {
        if (signal.aborted) return;
        setStepState(i, 'active');
        // Wait 800ms or until API resolves
        await Promise.race([sleep(800), apiPromise.then(function(){}).catch(function(){})]);
        if (signal.aborted) return;
        setStepState(i, 'done');
      }

      // Step 3: "检索数据库" — wait for API if still pending
      if (signal.aborted) return;
      setStepState(3, 'active');
      await Promise.race([sleep(800), apiPromise.then(function(){}).catch(function(){})]);
      if (signal.aborted) return;
      setStepState(3, 'done');

      // Step 4: "DeepSeek 推理" — must wait for API
      if (signal.aborted) return;
      setStepState(4, 'active');
      try {
        await apiPromise; // Wait for actual API response
      } catch(e) {
        // API will handle error separately, just complete animation
      }
      if (signal.aborted) return;
      setStepState(4, 'done');

      // Step 5: "生成推荐" — brief final step
      if (signal.aborted) return;
      setStepState(5, 'active');
      await sleep(500);
      if (signal.aborted) return;
      setStepState(5, 'done');
    }

    function completeAllSteps() {
      if (animationAbort) animationAbort.abort();
      document.querySelectorAll('.ai-thinking-step').forEach(el => {
        el.className = 'ai-thinking-step done';
      });
    }

    function showErrorCard(title, msg, showRetry) {
      clearSafetyTimer();
      if (animationAbort) animationAbort.abort();
      document.getElementById('ai-thinking').style.display = 'none';
      const errEl = document.getElementById('ai-error');
      errEl.style.display = 'block';
      document.getElementById('ai-error-title').textContent = title;
      document.getElementById('ai-error-msg').textContent = msg;
      document.getElementById('ai-retry-btn').style.display = showRetry ? 'inline-flex' : 'none';
      document.getElementById('ai-close-btn').style.display = showRetry ? 'none' : 'inline-flex';
    }

    // ── 按钮状态 ──────────────────────────────────────────
    function setButtonLoading() {
      const btn = document.getElementById('submit-btn');
      btn.classList.add('btn-loading');
      btn.innerHTML = '<span class="btn-spinner"></span>🤖 AI 正在分析…';
      btn.disabled = true;
    }

    function resetButton() {
      const btn = document.getElementById('submit-btn');
      btn.classList.remove('btn-loading');
      btn.innerHTML = '✨ 开始 AI 智能分析';
      btn.disabled = false;
    }

    // ── 核心提交流程 ──────────────────────────────────────
    function doSubmit(payload) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      // Create the API promise (fired immediately, animation syncs with it)
      var apiPromise = fetch(`${API_BASE}/api/recommend`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal,
      }).then(function (resp) {
        clearTimeout(timeoutId);
        if (!resp.ok) {
          return resp.text().then(function (errText) {
            throw new Error('HTTP ' + resp.status + ': ' + errText);
          });
        }
        return resp.json();
      });

      // Run animation synced with API
      runThinkingAnimation(apiPromise).then(function () {
        // Handle API result after animation completes
        return apiPromise.then(function (data) {
          completeAllSteps();

          // Store results
          sessionStorage.setItem('ht_recommend_results', JSON.stringify(data));

          // Preload destinations
          var destCtrl = new AbortController();
          var destTimeout = setTimeout(function () { destCtrl.abort(); }, 5000);
          return fetch(API_BASE + '/api/destinations', { signal: destCtrl.signal })
            .then(function (destResp) {
              clearTimeout(destTimeout);
              if (destResp.ok) {
                return destResp.json().then(function (destData) {
                  sessionStorage.setItem('ht_destinations', JSON.stringify(destData.results || []));
                });
              }
            }).catch(function () { /* degrade gracefully */ });
        }).then(function () {
          return sleep(400);
        }).then(function () {
          window.location.href = 'results.html';
        });
      }).catch(function (err) {
        clearTimeout(timeoutId);
        console.error('❌ 请求失败：', err);

        if (err.name === 'AbortError') {
          showErrorCard('AI 服务暂时繁忙', '请求超时（30 秒），DeepSeek 可能正在高负载运行，请稍后重试。', true);
        } else {
          showErrorCard('网络连接失败', '无法连接到后端服务。请确认服务已启动：\nhttp://127.0.0.1:8000', true);
        }
        resetButton();
      });
    }

    async function handleSubmit() {
      clearErrors();

      // 收集表单数据
      const age       = parseInt(document.getElementById('age').value, 10);
      const gender    = document.querySelector('input[name="gender"]:checked')?.value || '';
      const city      = document.getElementById('city').value.trim();
      const budgetKey = document.querySelector('input[name="budget"]:checked')?.value;
      const duration  = document.querySelector('input[name="duration"]:checked')?.value || '';
      const health    = [...document.querySelectorAll('input[name="health"]:checked')].map(c => c.value);
      const climateRaw= document.querySelector('input[name="climate"]:checked')?.value;
      const env       = [...document.querySelectorAll('input[name="environment"]:checked')].map(c => c.value);

      // 校验
      if (!age || age < 18 || age > 100) {
        showFieldError('age', '请填写有效的年龄（18–100 岁）');
        document.getElementById('age').focus();
        return;
      }
      if (!budgetKey) {
        showBudgetError('请选择月预算');
        return;
      }

      // 映射后端字段
      const healthStatus = health.length === 0 || health.includes('无特殊情况')
        ? '健康' : health.join('、');
      const notesParts = [];
      if (gender)   notesParts.push(`性别：${gender}`);
      if (city)     notesParts.push(`现居：${city}`);
      if (duration) notesParts.push(`计划时长：${duration}`);
      if (env.length && !env.includes('无要求')) {
        notesParts.push(`环境偏好：${env.join('、')}`);
      }

      lastPayload = {
        age, monthly_budget: BUDGET_MAP[budgetKey] || 4000,
        health_status: healthStatus,
        climate_preference: CLIMATE_MAP[climateRaw] || '不挑剔',
        activity_level: '轻度',
        additional_notes: notesParts.join('；'),
      };

      // 显示加载层 + 提交（doSubmit 内部管理动画+API）
      setButtonLoading();
      showOverlay();
      doSubmit(lastPayload);
    }

    // ── 重试 ──────────────────────────────────────────────
    function handleRetry() {
      if (!lastPayload) return;
      showOverlay();
      setButtonLoading();
      doSubmit(lastPayload);
    }

    function closeOverlay() {
      hideOverlay();
      resetButton();
    }
  </script>


  <!-- ══════════════════════════════════════════════════════ -->
  <!-- AI 分析加载层                                            -->
  <!-- ══════════════════════════════════════════════════════ -->
  <div id="ai-overlay" class="ai-overlay" style="display:none;">
    <div class="ai-overlay-card">

      <!-- 思考状态 -->
      <div id="ai-thinking">
        <div class="ai-thinking-header">
          <div class="ai-thinking-spinner">
            <span class="spinner-ring"></span>
          </div>
          <h3>AI 深度分析中</h3>
        </div>
        <div class="ai-thinking-steps">
          <div class="ai-thinking-step" data-step="0">
            <span class="step-icon"></span>
            <span class="step-text">读取您的健康需求…</span>
          </div>
          <div class="ai-thinking-step" data-step="1">
            <span class="step-icon"></span>
            <span class="step-text">分析健康状况与适合的海拔区间…</span>
          </div>
          <div class="ai-thinking-step" data-step="2">
            <span class="step-icon"></span>
            <span class="step-text">匹配预算与消费水平…</span>
          </div>
          <div class="ai-thinking-step" data-step="3">
            <span class="step-icon"></span>
            <span class="step-text">检索目的地环境数据库…</span>
          </div>
          <div class="ai-thinking-step" data-step="4">
            <span class="step-icon"></span>
            <span class="step-text">DeepSeek 大模型深度推理…</span>
          </div>
          <div class="ai-thinking-step" data-step="5">
            <span class="step-icon"></span>
            <span class="step-text">生成个性化推荐方案…</span>
          </div>
        </div>
      </div>

      <!-- 错误状态（初始隐藏） -->
      <div id="ai-error" class="ai-error-state" style="display:none;">
        <div class="ai-error-icon">⚠️</div>
        <h3 id="ai-error-title">网络连接失败</h3>
        <p id="ai-error-msg"></p>
        <div class="ai-error-actions">
          <button id="ai-retry-btn" class="btn btn-primary" onclick="handleRetry()">🔄 重新尝试</button>
          <button id="ai-close-btn" class="btn btn-outline" onclick="closeOverlay()" style="display:none;">关闭</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Navigation script -->
  <script src="js/nav.js"></script>
  <!-- UX Engine -->
  <script src="js/ux.js"></script>

</body>
</html>
